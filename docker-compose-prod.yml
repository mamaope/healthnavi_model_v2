services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_TRANSCRIPTION: ${INSTALL_TRANSCRIPTION:-false}
    container_name: empirico_cdss_api
    ports:
      - "8050:8050"
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - ./logs:/backend/logs
    environment:
      - MODEL_SERVICE_BASE_URL=${MODEL_SERVICE_BASE_URL:-https://empirico-model-service-e2dgjxq3uq-ew.a.run.app}
      - MODEL_SERVICE_API_KEY=${MODEL_SERVICE_API_KEY:-}
      - MODEL_SERVICE_TIMEOUT_SECONDS=${MODEL_SERVICE_TIMEOUT_SECONDS:-90}
      - EMPIRICO_QUICK_MODEL_TIMEOUT_SECONDS=${EMPIRICO_QUICK_MODEL_TIMEOUT_SECONDS:-45}
      - EMPIRICO_DEEP_MODEL_TIMEOUT_SECONDS=${EMPIRICO_DEEP_MODEL_TIMEOUT_SECONDS:-120}
      - EMPIRICO_QUICK_MODEL_NAME=${EMPIRICO_QUICK_MODEL_NAME:-gemini-2.5-flash}
      - EMPIRICO_QUICK_MAX_OUTPUT_TOKENS=${EMPIRICO_QUICK_MAX_OUTPUT_TOKENS:-900}
      - EMPIRICO_EVIDENCE_COUNTRY_CODE=${EMPIRICO_EVIDENCE_COUNTRY_CODE:-}
      - EMPIRICO_SOURCE_PREFERENCE_HINTS=${EMPIRICO_SOURCE_PREFERENCE_HINTS:-Uganda Ministry of Health Uganda Clinical Guidelines health.go.ug library.health.go.ug CPHL IDI Uganda WHO AFRO East Africa Africa}
      - EMPIRICO_SOURCE_PREFERENCE_TERMS=${EMPIRICO_SOURCE_PREFERENCE_TERMS:-uganda,ugandan,health.go.ug,library.health.go.ug,cphl.go.ug,idi.mak.ac.ug,elearning.idi.co.ug,uganda clinical guidelines,ministry of health uganda,who afro,afro.who.int,east africa,africa}
      - EMPIRICO_EVIDENCE_PROVIDER_MODE=${EMPIRICO_EVIDENCE_PROVIDER_MODE:-web}
      - EMPIRICO_QUICK_EVIDENCE_PROVIDER_MODE=${EMPIRICO_QUICK_EVIDENCE_PROVIDER_MODE:-crawl}
      - EMPIRICO_DEEP_EVIDENCE_PROVIDER_MODE=${EMPIRICO_DEEP_EVIDENCE_PROVIDER_MODE:-web}
      - EMPIRICO_QUICK_ENABLE_RETRIEVAL_PLANNER=${EMPIRICO_QUICK_ENABLE_RETRIEVAL_PLANNER:-false}
      - EMPIRICO_DEEP_ENABLE_RETRIEVAL_PLANNER=${EMPIRICO_DEEP_ENABLE_RETRIEVAL_PLANNER:-true}
      - EMPIRICO_QUICK_ENABLE_SEMANTIC_EVIDENCE_SELECTION=${EMPIRICO_QUICK_ENABLE_SEMANTIC_EVIDENCE_SELECTION:-false}
      - EMPIRICO_DEEP_ENABLE_SEMANTIC_EVIDENCE_SELECTION=${EMPIRICO_DEEP_ENABLE_SEMANTIC_EVIDENCE_SELECTION:-false}
      - EMPIRICO_FOLLOWUP_MODE=${EMPIRICO_FOLLOWUP_MODE:-local}
    command: sh -c "python3 /backend/scripts/fix_line_endings.py /backend/scripts/startup_prod.sh && chmod +x /backend/scripts/startup_prod.sh && bash /backend/scripts/startup_prod.sh"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s

  db:
    image: postgres:15-alpine
    container_name: empirico_cdss_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "log_min_messages=error"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_connections=off"
      - "-c"
      - "log_disconnections=off"
      - "-c"
      - "log_checkpoints=off"
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: empirico_cdss_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
