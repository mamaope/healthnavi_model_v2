services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_TRANSCRIPTION: ${INSTALL_TRANSCRIPTION:-false}
    container_name: empirico_cdss_api
    ports:
      - "8050:8050"
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - ./logs:/backend/logs
    environment:
      - MODEL_SERVICE_BASE_URL=${MODEL_SERVICE_BASE_URL:-https://empirico-model-service-e2dgjxq3uq-ew.a.run.app}
      - MODEL_SERVICE_API_KEY=${MODEL_SERVICE_API_KEY:-}
      - MODEL_SERVICE_TIMEOUT_SECONDS=${MODEL_SERVICE_TIMEOUT_SECONDS:-180}
      - EMPIRICO_QUICK_MODEL_TIMEOUT_SECONDS=${EMPIRICO_QUICK_MODEL_TIMEOUT_SECONDS:-30}
      - EMPIRICO_DEEP_MODEL_TIMEOUT_SECONDS=${EMPIRICO_DEEP_MODEL_TIMEOUT_SECONDS:-120}
      - EMPIRICO_QUICK_LATENCY_TARGET_SECONDS=${EMPIRICO_QUICK_LATENCY_TARGET_SECONDS:-14.5}
      - EMPIRICO_QUICK_MODEL_NAME=${EMPIRICO_QUICK_MODEL_NAME:-gemini-2.5-flash}
      - EMPIRICO_QUICK_MAX_OUTPUT_TOKENS=${EMPIRICO_QUICK_MAX_OUTPUT_TOKENS:-2000}
      - EMPIRICO_DEEP_MAX_OUTPUT_TOKENS=${EMPIRICO_DEEP_MAX_OUTPUT_TOKENS:-5000}
      - EMPIRICO_ANSWER_TEMPERATURE=${EMPIRICO_ANSWER_TEMPERATURE:-0.2}
      - EMPIRICO_QUICK_MAX_REFERENCES=${EMPIRICO_QUICK_MAX_REFERENCES:-4}
      - EMPIRICO_DEEP_MAX_REFERENCES=${EMPIRICO_DEEP_MAX_REFERENCES:-8}
      - EMPIRICO_QUICK_CONTEXT_SOURCES=${EMPIRICO_QUICK_CONTEXT_SOURCES:-12}
      - EMPIRICO_DEEP_CONTEXT_SOURCES=${EMPIRICO_DEEP_CONTEXT_SOURCES:-20}
      - EMPIRICO_QUICK_ANSWER_TOP_K=${EMPIRICO_QUICK_ANSWER_TOP_K:-4}
      - EMPIRICO_DEEP_ANSWER_TOP_K=${EMPIRICO_DEEP_ANSWER_TOP_K:-8}
      - EMPIRICO_QUICK_SEARCH_TOP_K=${EMPIRICO_QUICK_SEARCH_TOP_K:-8}
      - EMPIRICO_DEEP_SEARCH_TOP_K=${EMPIRICO_DEEP_SEARCH_TOP_K:-24}
      - EMPIRICO_EVIDENCE_COUNTRY_CODE=${EMPIRICO_EVIDENCE_COUNTRY_CODE:-UG}
      - EMPIRICO_SOURCE_PREFERENCE_HINTS=${EMPIRICO_SOURCE_PREFERENCE_HINTS:-Uganda Ministry of Health Knowledge Management Portal Uganda Clinical Guidelines health.go.ug library.health.go.ug NDA UNIPH CPHL NHLDS Uganda WHO AFRO East Africa Africa}
      - EMPIRICO_SOURCE_PREFERENCE_TERMS=${EMPIRICO_SOURCE_PREFERENCE_TERMS:-uganda,ugandan,health.go.ug,library.health.go.ug,nda.or.ug,uniph.go.ug,cphl.go.ug,qadash.cphl.go.ug,uci.or.ug,ulii.org,idi.mak.ac.ug,elearning.idi.co.ug,uganda clinical guidelines,ministry of health uganda,national drug authority uganda,uganda national institute of public health,uganda cancer institute,who afro,afro.who.int,east africa,africa}
      - EMPIRICO_EVIDENCE_PROVIDER_MODE=${EMPIRICO_EVIDENCE_PROVIDER_MODE:-web}
      - EMPIRICO_QUICK_EVIDENCE_PROVIDER_MODE=${EMPIRICO_QUICK_EVIDENCE_PROVIDER_MODE:-web}
      - EMPIRICO_DEEP_EVIDENCE_PROVIDER_MODE=${EMPIRICO_DEEP_EVIDENCE_PROVIDER_MODE:-web}
      - EMPIRICO_ENABLE_EVIDENCE_RESCUE=${EMPIRICO_ENABLE_EVIDENCE_RESCUE:-true}
      - EMPIRICO_QUICK_RETRIEVAL_EARLY_STOP=${EMPIRICO_QUICK_RETRIEVAL_EARLY_STOP:-true}
      - EMPIRICO_QUICK_RETRIEVAL_EARLY_STOP_WAIT_SECONDS=${EMPIRICO_QUICK_RETRIEVAL_EARLY_STOP_WAIT_SECONDS:-1.5}
      - EMPIRICO_QUICK_RESCUE_MIN_SECONDS=${EMPIRICO_QUICK_RESCUE_MIN_SECONDS:-2.5}
      - EMPIRICO_QUICK_ENABLE_RETRIEVAL_PLANNER=${EMPIRICO_QUICK_ENABLE_RETRIEVAL_PLANNER:-true}
      - EMPIRICO_DEEP_ENABLE_RETRIEVAL_PLANNER=${EMPIRICO_DEEP_ENABLE_RETRIEVAL_PLANNER:-true}
      - EMPIRICO_QUICK_ENABLE_SEMANTIC_EVIDENCE_SELECTION=${EMPIRICO_QUICK_ENABLE_SEMANTIC_EVIDENCE_SELECTION:-true}
      - EMPIRICO_DEEP_ENABLE_SEMANTIC_EVIDENCE_SELECTION=${EMPIRICO_DEEP_ENABLE_SEMANTIC_EVIDENCE_SELECTION:-true}
      - EMPIRICO_ENABLE_EVIDENCE_SUFFICIENCY_CHECK=${EMPIRICO_ENABLE_EVIDENCE_SUFFICIENCY_CHECK:-true}
      - EMPIRICO_QUICK_CRAWL_MAX_SOURCES=${EMPIRICO_QUICK_CRAWL_MAX_SOURCES:-4}
      - EMPIRICO_DEEP_CRAWL_MAX_SOURCES=${EMPIRICO_DEEP_CRAWL_MAX_SOURCES:-8}
      - EMPIRICO_QUICK_CRAWL_TIME_BUDGET_SECONDS=${EMPIRICO_QUICK_CRAWL_TIME_BUDGET_SECONDS:-8}
      - EMPIRICO_DEEP_CRAWL_TIME_BUDGET_SECONDS=${EMPIRICO_DEEP_CRAWL_TIME_BUDGET_SECONDS:-14}
      - EMPIRICO_QUICK_RETRIEVAL_TIME_BUDGET_SECONDS=${EMPIRICO_QUICK_RETRIEVAL_TIME_BUDGET_SECONDS:-10}
      - EMPIRICO_DEEP_RETRIEVAL_TIME_BUDGET_SECONDS=${EMPIRICO_DEEP_RETRIEVAL_TIME_BUDGET_SECONDS:-18}
      - EMPIRICO_QUICK_MAX_RESULTS_PER_PROVIDER=${EMPIRICO_QUICK_MAX_RESULTS_PER_PROVIDER:-4}
      - EMPIRICO_DEEP_MAX_RESULTS_PER_PROVIDER=${EMPIRICO_DEEP_MAX_RESULTS_PER_PROVIDER:-8}
      - EMPIRICO_FOLLOWUP_MODE=${EMPIRICO_FOLLOWUP_MODE:-local}

    # startup.sh: waits for db, runs 'alembic upgrade head', seeds admin, then uvicorn
    command: sh -c "python3 /backend/scripts/fix_line_endings.py /backend/scripts/startup.sh && chmod +x /backend/scripts/startup.sh && bash /backend/scripts/startup.sh"
    shm_size: "1gb"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s

  db:
    image: postgres:15-alpine
    container_name: empirico_cdss_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Only log errors; suppress all statement/connection/checkpoint logs
    command:
      - "postgres"
      - "-c"
      - "log_min_messages=error"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_connections=off"
      - "-c"
      - "log_disconnections=off"
      - "-c"
      - "log_checkpoints=off"
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    container_name: empirico_cdss_frontend
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/pnpm-store
    environment:
      - NODE_ENV=development
      - VITE_PROXY_TARGET=http://api:8050
      - CI=true
      - PNPM_CONFIG_CONFIRM_MODULES_PURGE=false
      - PNPM_STORE_DIR=/pnpm-store
      - PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    command: sh -c "corepack enable && corepack prepare && pnpm install --frozen-lockfile --config.confirmModulesPurge=false && until wget -q -T 2 -O- http://api:8050/api/v2/health >/dev/null; do echo 'Waiting for API...'; sleep 2; done && pnpm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  pnpm_store:
