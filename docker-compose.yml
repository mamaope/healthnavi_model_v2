services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: empirico_cdss_api
    ports:
      - "8050:8050"
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - ./logs:/backend/logs
      - ./regal-autonomy-454806-d1-edf68610c57a.json:/backend/regal-autonomy-454806-d1-edf68610c57a.json  # commented for local dev
    environment:
      - EVIDENCE_RETRIEVAL_TEST_MODE=true
      - MODEL_SERVICE_BASE_URL=${MODEL_SERVICE_BASE_URL:-http://host.docker.internal:8080}
      - MODEL_SERVICE_API_KEY=${MODEL_SERVICE_API_KEY:-}
      - MODEL_SERVICE_TIMEOUT_SECONDS=${MODEL_SERVICE_TIMEOUT_SECONDS:-120}
      - GOOGLE_APPLICATION_CREDENTIALS=/backend/regal-autonomy-454806-d1-edf68610c57a.json

    # startup.sh: waits for db, runs 'alembic upgrade head', seeds admin, then uvicorn
    command: sh -c "python3 /backend/scripts/fix_line_endings.py /backend/scripts/startup.sh && chmod +x /backend/scripts/startup.sh && bash /backend/scripts/startup.sh"
    shm_size: "1gb"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 180s

  db:
    image: postgres:15-alpine
    container_name: empirico_cdss_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Only log errors; suppress all statement/connection/checkpoint logs
    command:
      - "postgres"
      - "-c"
      - "log_min_messages=error"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_connections=off"
      - "-c"
      - "log_disconnections=off"
      - "-c"
      - "log_checkpoints=off"
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    container_name: empirico_cdss_frontend
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - pnpm_store:/pnpm-store
    environment:
      - NODE_ENV=development
      - VITE_PROXY_TARGET=http://api:8050
      - CI=true
      - PNPM_CONFIG_CONFIRM_MODULES_PURGE=false
      - PNPM_STORE_DIR=/pnpm-store
      - PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    command: sh -c "corepack enable && corepack prepare && pnpm install --frozen-lockfile --config.confirmModulesPurge=false && until wget -q -T 2 -O- http://api:8050/api/v2/health >/dev/null; do echo 'Waiting for API...'; sleep 2; done && pnpm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  pnpm_store:
